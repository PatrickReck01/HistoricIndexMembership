[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "historic-index-membership"
version = "0.1.0"
description = "Point-in-time stock index membership, reconstructed from the SEC holdings reports of index funds."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Patrick Reck" }]
keywords = ["sec", "edgar", "index", "constituents", "etf", "s&p 500", "finance"]
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "structlog>=24.1",
    "selectolax>=0.3.21",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
index-membership = "historic_index_membership.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/historic_index_membership"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/historic_index_membership"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["selectolax.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
